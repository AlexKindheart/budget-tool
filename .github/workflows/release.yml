# Builds BudgetTool-windows.zip and publishes it as a GitHub release whenever a version tag
# (v1.2.3) is pushed. The app's updater installs from these releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check VERSION matches the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne $env:TAG) { throw "VERSION file says $v but the tag is $env:TAG" }

      - name: Build
        run: |
          python -m pip install -r requirements.txt
          python -m PyInstaller --noconfirm --clean --windowed --name BudgetTool --add-data "templates;templates" --add-data "static;static" --add-data "VERSION;." budget_tool.py

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BudgetTool -DestinationPath BudgetTool-windows.zip
          $hash = (Get-FileHash BudgetTool-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BudgetTool-windows.zip" | Out-File -Encoding ascii BudgetTool-windows.zip.sha256

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG BudgetTool-windows.zip BudgetTool-windows.zip.sha256 --title "Budget Tool $env:TAG" --generate-notes
